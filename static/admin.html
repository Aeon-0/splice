<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Manage access — Splice</title><link rel="stylesheet" href="__BASE__/static/styles.css"><script src="__BASE__/static/admin.js" defer></script></head>
<body data-base-path="__BASE__"><header class="top-bar"><a class="wordmark text-button" href="__BASE__/">Splice.</a><a class="text-button" href="__BASE__/">Back to videos</a></header><main class="auth-page admin-page"><h1>Manage access</h1><p>Only approved emails can sign in. Adding an existing email resets its password and signs it out. Removing access signs the account out immediately.</p><div id="users" aria-label="Approved accounts"></div><form id="access-form"><label for="email">Email to approve</label><input id="email" type="email" autocomplete="off" required maxlength="254"><label for="initial-password">Initial password · 15–128 characters</label><input id="initial-password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required><label for="admin-password">Your administrator password · required for any access change</label><input id="admin-password" type="password" autocomplete="current-password" maxlength="128" required><button class="primary-button" type="submit">Approve access</button></form><p id="admin-status" role="status" hidden></p></main></body></html>
