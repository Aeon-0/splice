<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Create account — Splice</title><link rel="stylesheet" href="__BASE__/static/styles.css"><script src="__BASE__/static/signup.js" defer></script></head>
<body data-base-path="__BASE__">
  <main class="auth-page">
    <span class="wordmark">Splice<span class="brand-dot">.</span></span>
    <h1>Create account</h1>
    <p>Luke will need to approve your account before you can sign in.</p>
    <form id="signup-form">
      <label for="email">Email</label><input id="email" type="email" autocomplete="username" maxlength="254" required>
      <label for="password">Password · 15–128 characters</label><input id="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required>
      <button id="create-account" class="primary-button" type="submit">Create account</button>
      <p id="signup-error" class="error-message" role="alert" hidden></p>
    </form>
    <a class="text-button" href="__BASE__/login">Sign in</a>
  </main>
</body>
</html>
